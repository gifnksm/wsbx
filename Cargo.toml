[package]
name = "wsbx"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "A type-safe Rust API for controlling Windows Sandbox, through the `wsb` CLI"
repository = "https://github.com/gifnksm/wsbx"
license = "MIT OR Apache-2.0"
keywords = ["cli", "sandbox", "windows", "wsb"]
categories = ["api-bindings", "os::windows-apis"]

[package.metadata.cargo-sync-rdme.rustdoc]
toolchain = "nightly"

[package.metadata.cargo-sync-rdme.badge]
style = "flat-square"
badges = {
  maintenance = true,
  license = { link = "#license" },
  crates-io = true,
  docs-rs = true,
  rust-version = true,
  github-actions = { workflows = "ci.yml" },
  codecov = true,
}

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["serde"] }

[dev-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
indoc = "2.0.7"

[build-dependencies]

[badges]
maintenance = { status = "actively-developed" }

[profile.dev]

[profile.release]
